<svg xmlns="http://www.w3.org/2000/svg"
     width="120"
     height="28"
     viewBox="0 0 120 28"
     role="img"
     aria-label="base">

  <!-- Badge background -->
     <rect width="120" height="28" fill="#525252"/>

  <!-- External logo -->
     <image
          href="logo.svg"
          x="6"
          y="6"
          width="16"
          height="16"
          preserveAspectRatio="xMidYMid meet"/>

  <!-- Text -->
     <text
          x="28"
          y="18"
          fill="#ffffff"
          font-family="Verdana, Geneva, DejaVu Sans, sans-serif"
          font-size="11">
          base
     </text>

</svg>


